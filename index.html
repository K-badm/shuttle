<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<!-- 読み込んでよい相手を決める（CSP）。ページに仕込まれたスクリプトは動かない。通信先は Firebase（Firestore・ログイン）と Google Fonts だけ。外部のサイトを足すときはここも直す -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://www.gstatic.com; frame-src https://badminton-4135c.firebaseapp.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>組み合わせ</title>
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#1f6b52">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="シャトル">
<script src="config.js?v=4"></script><!-- config.js を変えたら v= の数字も上げる（古い控えを読まないため） -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+1:wght@500;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}

/* Layout: sticky header + tab bar, single column of panels; match cards laid out like courts with a center net line */
:root{
  --bg:#f3f5f1; --surface:#ffffff; --line:#d9dfd6; --fg:#1b241f; --muted:#5f6c64;
  --court:#1f6b52; --court-ink:#ffffff; --cork:#c98b3c; --cork-soft:#f6ead8;
  --warn:#b4372f; --warn-soft:#fbe7e4; --ok:#2b7a4b;
  --lv1:#123f31; --lv2:#2a7558; --lv3:#7aa892; --lv4:#c8dccd; --lv5:#eef3ee;
  --lvf1:#fff; --lvf2:#fff; --lvf3:#0f241b; --lvf4:#183326; --lvf5:#3a4a40;
  --m0:#c4561e; --m1:#2f62c4; --m2:#8a3fb5; --m3:#c22f6b; --m4:#0e8a8a; --m5:#7a6a12; --mk-ink:#ffffff;
  --f-display:"M PLUS 1","Hiragino Sans",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111613; --surface:#18201b; --line:#2b362f; --fg:#e7ede8; --muted:#9aa89f;
  --court:#2f8a6a; --court-ink:#ffffff; --cork:#e0a65a; --cork-soft:#3a2d1c;
  --warn:#f07a70; --warn-soft:#3b1d1a; --ok:#6fcf97;
  --lv1:#b9e3cf; --lv2:#7cc4a3; --lv3:#45806a; --lv4:#2b4a3c; --lv5:#223029;
  --lvf1:#0d221a; --lvf2:#0d221a; --lvf3:#f0f6f2; --lvf4:#d9e8df; --lvf5:#b6c4bb;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111613; --surface:#18201b; --line:#2b362f; --fg:#e7ede8; --muted:#9aa89f;
  --court:#2f8a6a; --court-ink:#ffffff; --cork:#e0a65a; --cork-soft:#3a2d1c;
  --warn:#f07a70; --warn-soft:#3b1d1a; --ok:#6fcf97;
  --lv1:#b9e3cf; --lv2:#7cc4a3; --lv3:#45806a; --lv4:#2b4a3c; --lv5:#223029;
  --lvf1:#0d221a; --lvf2:#0d221a; --lvf3:#f0f6f2; --lvf4:#d9e8df; --lvf5:#b6c4bb;
  color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--court)}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--court);color:var(--court-ink)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-block:12px 0;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:.02em;display:flex;align-items:center;gap:8px}
.brand svg{flex:none}
.date{font-family:var(--f-mono);font-size:12px;opacity:.85;margin-left:auto}
nav.tabs{display:flex;gap:2px;width:100%;overflow-x:auto;margin-top:6px}
nav.tabs button{flex:1 0 auto;min-width:0;white-space:nowrap;background:none;border:0;color:var(--court-ink);opacity:.7;font:500 14px var(--f-body);padding:10px 10px;border-bottom:3px solid transparent;cursor:pointer}
nav.tabs button[aria-selected="true"]{opacity:1;border-bottom-color:var(--cork);font-weight:700}
main{padding-block:20px 48px;display:grid;gap:20px}
/* 「今日」タブ：表示する内容を選ぶボタンと、選んだ内容を並べる欄。
   横に広い画面（タブレットの横向きなど）では横に並べ、欄ごとにスクロールする */
body.wide .wrap{max-width:1480px}
.paneSel{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pchip{font:700 14px var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:8px 16px;min-height:40px;cursor:pointer}
.pchip[aria-pressed="true"]{background:var(--court);border-color:var(--court);color:var(--court-ink)}
.pchip[aria-pressed="true"]::before{content:"✓ "}
.panes{display:flex;flex-direction:column;gap:28px}
.pane{min-width:0}
@media (min-width:900px){
  .panes.multi{flex-direction:row;align-items:flex-start;gap:16px}
  /* 表示の切り替えボタンは見出しの下に固定する（欄の中をスクロールしても隠れたままにならないように） */
  body.wide .paneSel{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hdr,100px));z-index:4;background:var(--bg);padding-block:10px 8px}
  /* 並べて表示するときはページ全体をスクロールさせず、欄の中だけをスクロールする（上の方が見出しの下に隠れて戻せなくなるのを防ぐ） */
  body.wide main{padding-block:0;gap:0}
  body.wide .mock{margin:0;padding:4px 0}
  .panes.multi .pane{flex:1 1 0;max-height:calc(100dvh - env(safe-area-inset-top,0px) - var(--hdr,100px) - var(--psel,60px) - var(--foot,32px));overflow-y:auto;padding:2px 6px 24px 2px}
  .panes.multi .pane-matches{flex-grow:2}
}

section.panel{display:grid;gap:16px}
h2{font-family:var(--f-display);font-weight:800;font-size:19px;margin:0;text-wrap:balance}
h3{font-size:14px;margin:0;color:var(--muted);font-weight:700;letter-spacing:.04em}
.note{color:var(--muted);font-size:13px;margin:0}
.box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=text],input[type=number],select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:7px 10px;min-width:0}
input[type=number]{width:76px;font-family:var(--f-mono)}
button.btn{font:700 14px var(--f-body);border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 14px;cursor:pointer}
button.btn.primary{background:var(--cork);border-color:var(--cork);color:#1b1206}
button.btn:hover{filter:brightness(1.05)}
button:focus-visible,input:focus-visible,select:focus-visible,label.chk:focus-within{outline:2px solid var(--cork);outline-offset:2px}
button.x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:18px;padding:2px 8px}

.lv{display:inline-grid;place-items:center;min-width:30px;height:22px;padding:0 5px;border-radius:5px;font:700 12px var(--f-body);flex:none;white-space:nowrap}
.lv1{background:var(--lv1);color:var(--lvf1)}.lv2{background:var(--lv2);color:var(--lvf2)}.lv3{background:var(--lv3);color:var(--lvf3)}.lv4{background:var(--lv4);color:var(--lvf4)}.lv5{background:var(--lv5);color:var(--lvf5);box-shadow:inset 0 0 0 1px var(--line)}
.mk{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 4px;border-radius:999px;font:800 11px var(--f-display);color:var(--mk-ink);flex:none}
.mk0{background:var(--m0)}.mk1{background:var(--m1)}.mk2{background:var(--m2)}.mk3{background:var(--m3)}.mk4{background:var(--m4)}.mk5{background:var(--m5)}
.tag.pr{background:var(--surface);border:1px solid currentColor;display:inline-flex;gap:4px;align-items:center}
.tpitem{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:6px 6px 6px 10px;font-size:14px}
.tpitem .nm{flex:1;min-width:0}
.no{font-family:var(--f-mono);font-weight:600;font-size:12px;color:var(--muted);min-width:24px;text-align:right;font-variant-numeric:tabular-nums}

/* members */
.mlist{display:grid;gap:0}
.mrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.mrow:last-child{border-bottom:0}
.mrow .nm{flex:1;min-width:0;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow input.nm{font:500 15px var(--f-body);background:transparent;border-color:transparent;padding:4px 8px;margin-left:-8px}
.mrow input.nm:hover{border-color:var(--line)}
.mrow input.nm:focus{background:var(--bg);border-color:var(--line)}
.seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;flex:none}
@media (max-width:520px){.mrow .nm{flex-basis:50%}.mrow .seg{order:5;margin-left:40px}.mrow .x{order:4}}
.seg button{border:0;background:var(--surface);color:var(--muted);font:600 13px var(--f-body);width:38px;height:28px;cursor:pointer;border-left:1px solid var(--line);white-space:nowrap}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--court);color:var(--court-ink)}
.ngmark{color:var(--warn);font-size:12px;font-weight:700;background:var(--warn-soft);padding:1px 6px;border-radius:4px;flex:none}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);align-items:center}
.legend span.it{display:flex;gap:4px;align-items:center}
.nglist{display:grid;gap:6px;margin-top:4px}
.ngitem{display:flex;align-items:center;gap:8px;background:var(--warn-soft);border-radius:7px;padding:6px 6px 6px 10px;font-size:14px}
.ngitem .sep{color:var(--warn);font-weight:700}

/* attend */
.alist{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px}
label.chk{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer}
label.chk input{accent-color:var(--court);width:18px;height:18px;margin:0}
label.chk.off{opacity:.55}
label.chk .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dist{display:flex;gap:4px;align-items:flex-end;height:54px}
.dist .b{flex:1;display:grid;gap:3px;justify-items:center;font:600 11px var(--f-mono);color:var(--muted)}
.dist .bar{width:100%;border-radius:4px 4px 0 0}

/* stats strip */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat b{display:block;font:600 20px var(--f-mono);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.stat.bad b{color:var(--warn)} .stat.good b{color:var(--ok)}


/* matches */
.cfg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}
.cfg label{display:grid;gap:4px;font-size:12px;color:var(--muted);font-weight:700}
.round{display:grid;gap:8px}
.rhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.rhead .rn{font-family:var(--f-display);font-weight:800;font-size:16px}
.rhead .rest{font-size:12px;color:var(--muted);min-width:0}
.rhead .btn.sm{margin-left:auto;padding:4px 12px;font-size:13px}
.rhead .tag{margin-left:0}
.tag.ok{background:var(--surface);color:var(--ok);border:1px solid currentColor}
.round.done .courts{opacity:.5}
.courts{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.match{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.match.cross{border-color:var(--cork);box-shadow:inset 4px 0 0 var(--cork)}
body.user .match.cross{border-color:var(--line);box-shadow:none}
.match.dim{opacity:.3}
/* 手で入れ替えられる名前 */
.drag{cursor:grab;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;border-radius:6px;transition:background .1s}
.p.drag{margin:-2px -4px;padding:2px 4px}
.drag:hover{background:var(--cork-soft)}
.drag.dragging{opacity:.35}
.drag.drop{outline:2px dashed var(--cork);outline-offset:1px;background:var(--cork-soft)}
.drag.picked{outline:2px solid var(--court);outline-offset:1px;background:var(--cork-soft)}
.ghost{position:fixed;z-index:40;pointer-events:none;display:flex;gap:6px;align-items:center;font-size:14px;padding:4px 8px;border-radius:8px;background:var(--surface);border:2px solid var(--cork);box-shadow:0 8px 24px rgba(0,0,0,.25)}
.restchips{display:flex;flex-wrap:wrap;gap:4px}
.logl{display:grid;border:1px solid var(--line);border-radius:8px;max-height:220px;overflow:auto}
.logi{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;padding:6px 10px;border-bottom:1px solid var(--line);font-size:14px}
.logi:last-child{border-bottom:0}
.logi .lt{font-family:var(--f-mono);font-size:12px;color:var(--muted);min-width:38px}
.logi .ln{font-weight:700}
.lk{font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--cork-soft);color:var(--cork)}
.lk-leave,.lk-absent{background:var(--warn-soft);color:var(--warn)}
.lk-arrive,.lk-join{background:var(--court);color:var(--court-ink)}
.rchip .no{min-width:0}
body.nosel{-webkit-user-select:none;user-select:none}
.rchip{display:inline-flex;gap:4px;align-items:center;font-size:12px;padding:2px 8px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
/* 始まった試合はグレーにする（管理者が「開始」を押した順） */
.match.started{background:var(--bg);filter:grayscale(1);opacity:.55}
.match.started.dim{opacity:.25}
.mh .btn.go{margin-left:auto;padding:3px 12px;font-size:12px;background:var(--court);border-color:var(--court);color:var(--court-ink)}
.mh .btn.undo{margin-left:auto;padding:3px 10px;font-size:12px}
.mh .tag+.btn{margin-left:6px}
.progress{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px;font-weight:700}
.progress .pill{background:var(--court);color:var(--court-ink);border-radius:999px;padding:2px 12px;font-size:13px}
.popup{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 76px);transform:translateX(-50%);z-index:30;background:var(--fg);color:var(--bg);padding:12px 20px;border-radius:12px;font-weight:700;font-size:15px;box-shadow:0 6px 24px rgba(0,0,0,.25);max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:no-preference){.popup{animation:pop .2s ease-out}@keyframes pop{from{opacity:0;transform:translate(-50%,-8px)}to{opacity:1;transform:translate(-50%,0)}}}
.mh{display:flex;gap:8px;align-items:center;padding:6px 12px;border-bottom:1px dashed var(--line);font-size:12px;color:var(--muted)}
.mh .mno{font-family:var(--f-mono);font-weight:600;color:var(--fg)}
.tag{margin-left:auto;white-space:nowrap;flex:none;font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--cork-soft);color:var(--cork)}
.tag+.tag{margin-left:4px}
.msel{flex:1;min-width:180px}
.msel summary{list-style:none;cursor:pointer;border:1px solid var(--line);border-radius:7px;padding:7px 30px 7px 10px;background:var(--bg);position:relative;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msel summary::-webkit-details-marker{display:none}
.msel summary::after{content:"▾";position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--muted)}
.msel[open] summary::after{content:"▴"}
.mlist2{display:grid;gap:0;max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:7px;margin-top:4px;padding:4px 8px;background:var(--surface)}
.mopt{display:flex;gap:8px;align-items:center;padding:7px 2px;font-size:14px;border-bottom:1px solid var(--line);cursor:pointer}
.mopt:last-child{border-bottom:0}
.mopt input{width:18px;height:18px;margin:0;accent-color:var(--court);flex:none}
.tag.bad{background:var(--warn-soft);color:var(--warn)}
.teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch}
.team{display:grid;gap:4px;padding:8px 10px;min-width:0}
.net{width:1px;background:repeating-linear-gradient(var(--line) 0 4px,transparent 4px 7px);position:relative}
.p{display:flex;gap:6px;align-items:center;font-size:14px;min-width:0}
.p .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.p.hl .nm{background:var(--cork-soft);color:var(--fg);border-radius:4px;padding:0 4px;font-weight:700}
.tsum{font:500 11px var(--f-mono);color:var(--muted)}

/* table */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:460px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:700;background:var(--bg)}
td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
tr:last-child td{border-bottom:0}
.pips{display:flex;gap:2px}
.pip{width:8px;height:14px;border-radius:2px;background:var(--line)}
.pip.on{background:var(--court)} .pip.x{background:var(--cork)}
.pip.fut{opacity:.35} /* これからの試合 */
td.now{font-weight:700;font-size:15px}
td.now.low{color:var(--cork)} /* 今いちばん少ない人 */
body.user .pip.x{background:var(--court)}
tr.click{cursor:pointer} tr.click:hover td{background:var(--bg)}
body.user .lv,body.user .tsum,body.user .admin{display:none!important}
body:not(.owner) .owner{display:none!important}
.aitem{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:6px 6px 6px 10px;font-size:14px}
.aitem .em{flex:1;min-width:0;overflow-wrap:anywhere}
.rolechip{font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--court);color:var(--court-ink);white-space:nowrap;flex:none}
.modebtn{background:rgba(255,255,255,.14);color:var(--court-ink);border:1px solid rgba(255,255,255,.35);border-radius:999px;font:700 12px var(--f-body);padding:4px 12px;cursor:pointer}
.modebtn[aria-pressed="true"]{background:var(--cork);border-color:var(--cork);color:#1b1206}
.mock{font-size:12px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:no-preference){.match{transition:opacity .15s}}
/* 折りたたみの欄（設定・遅刻早退・使い方）。閉じているときは1行だけ */
.det{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.det>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:10px 14px;min-height:44px}
.det>summary::-webkit-details-marker{display:none}
.det>summary::before{content:"▸";color:var(--muted);flex:none;width:12px}
.det[open]>summary::before{content:"▾"}
.det .dt{font-weight:700;font-size:15px;flex:none}
.det .ds{font-size:13px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.det .detb{display:grid;gap:12px;padding:4px 14px 14px;border-top:1px dashed var(--line);padding-top:12px}
.warnc{color:var(--cork)}
/* 次にコートに入る試合を目立たせる */
.match.next{border-color:var(--court);box-shadow:0 0 0 2px var(--court)}
.match.next.cross{box-shadow:0 0 0 2px var(--court),inset 4px 0 0 var(--cork)}
body.user .match.next.cross{box-shadow:0 0 0 2px var(--court)}
.tag.next{background:var(--court);color:var(--court-ink);margin-left:6px}
.mh .tag.next+.tag,.mh .tag.next+.btn{margin-left:auto}
/* 読みやすさ：組み合わせの名前と番号を大きく、集計は1行おきに色を付ける */
.match .p{font-size:16px;gap:5px}
.match .p .nm{font-weight:500;white-space:normal;overflow-wrap:anywhere;line-height:1.25} /* 名前は切らずに折り返す */
.match .p .lv{min-width:26px;padding:0 3px;font-size:11px}
.match .p .no{font-size:14px;color:var(--fg);min-width:18px}
.match .team{gap:6px;padding:10px 8px}
.mh{font-size:13px}
.mh .mno{font-size:14px}
.rhead{border-top:1px solid var(--line);padding-top:12px;margin-top:4px}
.rhead .rn{font-size:17px}
.rhead .rest{font-size:13px}
.rchip{font-size:13px;padding:3px 10px}
table{font-size:15px}
tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--bg) 55%,transparent)}
.stats{grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:6px}
.stat{padding:8px 10px}
.stat b{font-size:18px}
.stat span{font-size:11.5px;line-height:1.35;display:block}
/* 指で操作する画面（タブレット・スマホ）では、押す所を大きくする */
/* QRコード（白地に黒で出す。印刷のときはこれだけを刷る） */
.qrbox{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.qrbox[hidden],.a2hs[hidden]{display:none}
.qrcard{background:#fff;color:#111;border-radius:16px;padding:24px 24px 18px;width:min(460px,100%);text-align:center}
.qrcard h2{margin:0;font-size:26px;color:#111}
.qrcard .qlead{margin:6px 0 10px;font-size:17px;font-weight:700;color:#111}
.qrcard .qrimg svg{display:block;width:min(320px,100%);height:auto;margin:0 auto}
.qrcard .qsub{margin:10px 0 4px;font-size:14px;color:#333}
.qrcard .qurl{margin:0 0 14px;font-family:var(--f-mono);font-size:12px;color:#555;word-break:break-all}
.qrcard .qbtns{display:flex;gap:10px;justify-content:center}
.qrcard .btn:not(.primary){background:#eee;color:#111;border-color:#ccc}
@media print{
  body.qr-open>*:not(.qrbox){display:none!important}
  body.qr-open{background:#fff!important}
  body.qr-open .qrbox{position:static;background:none;padding:0;display:block}
  body.qr-open .qrcard{width:100%;margin:10vh auto 0;padding:0}
  body.qr-open .qrcard h2{font-size:44px} body.qr-open .qrcard .qlead{font-size:26px}
  body.qr-open .qrcard .qrimg svg{width:110mm} body.qr-open .qrcard .qsub{font-size:18px}
  body.qr-open .qbtns{display:none}
}
/* ホーム画面に追加する案内（画面の下に出す） */
.a2hs{position:fixed;left:0;right:0;bottom:0;z-index:25;padding:10px 12px calc(env(safe-area-inset-bottom,0px) + 10px);pointer-events:none}
.a2in{pointer-events:auto;max-width:560px;margin:0 auto;background:var(--surface);border:1px solid var(--court);border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.3);padding:12px 44px 12px 14px;position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.a2in p{margin:0;font-size:14px;line-height:1.6;flex:1;min-width:200px}
.a2in .x{position:absolute;right:6px;top:6px}
.a2in .shr{display:inline-flex;vertical-align:-4px;color:var(--court)}
@media (pointer:coarse){
  button.btn{min-height:44px;padding:10px 16px}
  .rhead .btn.sm{min-height:40px}
  .pchip{min-height:44px;padding:10px 18px;font-size:15px}
  nav.tabs button{padding:12px 10px;font-size:15px}
  .seg button{width:46px;height:42px}
  label.chk{min-height:48px}
  label.chk input{width:22px;height:22px}
  input[type=text],input[type=number],select{min-height:42px}
}</style>
</head>
